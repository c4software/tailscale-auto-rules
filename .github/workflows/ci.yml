name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilation, lint, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatage (ktlint)
        run: ./gradlew ktlintCheck --no-configuration-cache

      - name: Analyse statique (Detekt)
        run: ./gradlew detekt --no-configuration-cache

      - name: Lint Android
        run: ./gradlew lint

      - name: Tests unitaires
        run: ./gradlew test

      - name: Couverture du domaine
        run: ./gradlew :domain:koverVerify :domain:koverXmlReport

      - name: Compilation
        run: ./gradlew assembleDebug

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/
          retention-days: 7
