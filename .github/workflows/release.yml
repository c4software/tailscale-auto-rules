name: Publication

# Déclenché à la main, et sur une étiquette de version.
#
# Pas sur `push` : construire un artefact signé à chaque commit consommerait du
# crédit pour un résultat que personne n'attend, et multiplierait sans raison le
# nombre d'exécutions ayant accès à la clé de signature.
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Créer une publication GitHub avec les artefacts"
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Construire et signer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # `RELEASE_VERSION` porte la version pour toute la suite du job.
      #
      # Sur étiquette, elle en vient directement : `actions/checkout` ne
      # rapatrie qu'un commit, sans les étiquettes, et `git describe` y
      # échouerait — l'artefact aurait porté la version de repli sans que rien
      # ne le dise. Sur un déclenchement manuel, il n'y a pas d'étiquette : la
      # variable reste vide, et la construction retombe volontairement sur le
      # repli plutôt que d'inventer un numéro.
      - name: Déterminer la version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "RELEASE_VERSION=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "Version : ${{ github.ref_name }}"
          else
            echo "Aucune étiquette : construction intermédiaire, version de repli."
          fi

      - name: Configurer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # La vérification passe avant la signature : signer un artefact qui
      # n'a pas été éprouvé reviendrait à donner de la valeur à du code non
      # vérifié. Mêmes tâches qu'AGENTS.md §5, pour qu'il n'y ait qu'une
      # définition de « vérifié » dans le projet.
      - name: Vérification complète
        run: ./gradlew ktlintCheck detekt lint test :domain:koverVerify

      # Restituée dans le répertoire de travail du job, effacée à la fin — elle
      # ne passe ni par le dépôt ni par le cache Gradle.
      - name: Restituer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret RELEASE_KEYSTORE_BASE64 est absent."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Construire l'APK et le bundle signés
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # Sans cette vérification, une clé mal restituée produirait un artefact
      # non signé que rien ne signalerait avant le rejet par le Play Store.
      - name: Constater que l'artefact est bien signé
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # La version est lue **dans l'artefact**, jamais supposée depuis la
      # variable qui l'a produite : c'est la seule façon de constater que la
      # chaîne a bien fonctionné de bout en bout. Une variable ignorée par
      # erreur donnerait sinon un APK estampillé `0.0.0-inconnue` publié sous
      # une étiquette de version.
      - name: Constater que l'artefact porte la version de l'étiquette
        if: github.ref_type == 'tag'
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -1)
          echo "$badging"
          attendu="${GITHUB_REF_NAME#v}"
          if ! echo "$badging" | grep -q "versionName='$attendu'"; then
            echo "::error::L'artefact ne porte pas la version $attendu."
            exit 1
          fi

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-auto-rules-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  publication:
    name: Créer la publication GitHub
    needs: release
    runs-on: ubuntu-latest
    # Uniquement sur étiquette, ou sur demande explicite : une publication est
    # une action sortante, elle ne doit pas survenir par effet de bord.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tailscale-auto-rules-release
          path: artefacts

      # Publiée directement lorsqu'une étiquette l'a déclenchée : poser une
      # étiquette de version **est** la décision de publier, et laisser un
      # brouillon derrière obligerait à la reprendre à la main — étape qu'on
      # oublie, et qui laisse une version annoncée mais introuvable.
      #
      # Un déclenchement manuel reste un brouillon : il ne correspond à aucune
      # étiquette, donc à aucune version, et n'a rien à annoncer.
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/**/*
          generate_release_notes: true
          draft: ${{ github.ref_type != 'tag' }}
