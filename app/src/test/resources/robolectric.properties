# Robolectric 4.16.1 ne fournit pas encore d'image pour l'API 37 (targetSdk du
# projet). On simule donc le dernier niveau qu'il sait instancier.
#
# À relever dès qu'une version de Robolectric supporte l'API cible : les tests
# doivent s'exécuter aussi près que possible de l'environnement réel.
sdk=35

# La vraie Application lance une observation des réglages qui vit aussi
# longtemps que le processus — ici, la JVM de test. Elle survivait donc au test
# et retombait sur un environnement démonté, faisant échouer le test suivant.
application=fr.vbrosseau.tailscaleautorules.TestApplication

# Rendu graphique réel, requis par Roborazzi : en mode LEGACY, Robolectric ne
# dessine rien et les captures d'écran seraient uniformément vides.
graphicsMode=NATIVE
